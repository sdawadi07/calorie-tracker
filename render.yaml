databases:
  - name: calorie-tracker-db
    plan: free

services:
  - type: web
    name: calorie-tracker-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calorie-tracker-db
          property: connectionString
      - key: USDA_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
